    <script type="module">
        // Parámetros configurables para rango de x e y
        const testData = [];
        const numLines = 4; // Más líneas
        const pointsPerLine = 6;
        const xStart = 0;
        const xEnd = 8;
        const yMin = 0;
        const yMax = 100;

        // El punto por el que debe pasar la curva
        const targetX = 4.3;
        const targetY = 40.2;

        // Genera varias líneas en el dominio [xStart, xEnd]
        for (let l = 0; l < numLines; l++) {
            const linePoints = [];
            for (let p = 0; p < pointsPerLine; p++) {
            const x = xStart + ((xEnd - xStart) * p) / (pointsPerLine - 1);
            // Distribuye las líneas en el rango vertical
            let y = yMin + ((yMax - yMin) * l) / (numLines - 1);
            // Para la línea central, pasa por el punto objetivo
            if (l === Math.floor(numLines / 2) && p === Math.floor(pointsPerLine / 2)) {
                linePoints.push({ x: targetX, y: targetY });
            } else {
                linePoints.push({ x, y: y + Math.sin(x + l) * 10 });
            }
            }
            for (const pt of linePoints) {
            testData.push({
                id: `curve_${l}`,
                x: pt.x,
                y: pt.y
            });
            }
        }
