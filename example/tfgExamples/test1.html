<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeWidget</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="../../dist/TimeWidget.js"></script>
</head>
<body>
    <div id="widget-container"></div>

    <script type="module">
        const numLines = 100000;
        const pointsPerLine = 6;
        const xStart = 0, xEnd = 8, yMin = 0, yMax = 100;
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        const testData = [];
        for (let c = 0; c < numLines; c++) {
            const id = `sharp_poly_${c}`;
            const baseY = 10 + (c / Math.max(1, numLines - 1)) * (yMax - 20);
            const slope = (c % 2 === 0) ? 4 : -3;
            for (let i = 0; i < pointsPerLine; i++) {
                const t = xStart + (xEnd - xStart) * i / Math.max(1, pointsPerLine - 1);
                const oscillation = Math.sin(t * 50) * 20;
                const spike = (Math.random() < 0.3) ? (Math.random() > 0.5 ? yMax : yMin) : 0;
                const y = baseY + slope * (t - (xStart + xEnd) / 2) + oscillation + spike;
                testData.push({ id, x: t, y: clamp(y, yMin, yMax) });
            }
        }

        const curvasDeReferencia = [
            {
                id: 'full_domain_points',
                data: Array.from({ length: 25 }, (_, i) => {
                    const t = xStart + (xEnd - xStart) * i / 24;
                    const y = yMin + (yMax - yMin) * 0.5 + Math.sin((t - xStart) / (xEnd - xStart) * Math.PI * 2) * 12;
                    return [t, clamp(y, yMin, yMax)];
                }),
                color: '#e91e63',
                pointRadius: 4,
                strokeColor: '#ffffff',
                strokeWidth: 1.5,
                isSimplePoints: true,
                collisionActive: true
            },
            {
                id: 'full_domain_polyline',
                data: Array.from({ length: 9 }, (_, i) => {
                    const t = xStart + (xEnd - xStart) * i / 8;
                    const y = yMin + (yMax - yMin) * (i / 8) + Math.cos((i / 8) * Math.PI) * 8;
                    return [t, clamp(y, yMin, yMax)];
                }),
                color: '#2196f3',
                strokeWidth: 2,
                opacity: 0.9,
                isSimplePoints: false,
                collisionActive: true
            }
        ];

        const widget = TimeWidget(testData, {
            target: document.getElementById('widget-container'),
            width: 800,
            height: 400,
            showGrid: true,
            referenceCurves: curvasDeReferencia,
        });
    </script>
</body>
</html>
