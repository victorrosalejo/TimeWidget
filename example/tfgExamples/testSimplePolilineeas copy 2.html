        // Rellena el gráfico con varias polilíneas de alta frecuencia/amplitud
        // Configuración fácil para regular el número de polilíneas y puntos por polilínea
        const numLines = 1;           // ← Cambia aquí cuántas polilíneas quieres
        const pointsPerLine = 6;       // ← Puntos por polilínea (2 = segmento simple, >2 = polilínea)
        const xStart = 0, xEnd = 8, yMin = 0, yMax = 100;
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        // Genera polilíneas con curvas muy puntiagudas: líneas con muchos picos extremos
        const testData = [];
        for (let c = 0; c < numLines; c++) {
            const id = `sharp_poly_${c}`;
            // distribución vertical base para separar visualmente las líneas
            const baseY = 10 + (c / Math.max(1, numLines - 1)) * (yMax - 20);
            // pequeña inclinación por línea para hacerlas distintas
            const slope = (c % 2 === 0) ? 4 : -3;
            for (let i = 0; i < pointsPerLine; i++) {
            const t = xStart + (xEnd - xStart) * i / Math.max(1, pointsPerLine - 1);
            // y con muchos picos: base + tendencia + oscilación alta frecuencia + picos aleatorios frecuentes extremos
            const oscillation = Math.sin(t * 50) * 20; // Mayor frecuencia y amplitud para más picos
            const spike = (Math.random() < 0.3) ? (Math.random() > 0.5 ? yMax : yMin) : 0; // Picos más frecuentes
            const y = baseY + slope * (t - (xStart + xEnd) / 2) + oscillation + spike;
            testData.push({ id, x: t, y: clamp(y, yMin, yMax) });
            }
        }

                const t = xStart + (xEnd - xStart) * i / 24;

            }),

,

            }),
